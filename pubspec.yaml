name: toji_trainer
description: "FitQuest — Android gym & nutrition tracker with gamified quests."
publish_to: "none"
version: 1.1.2+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Local storage (SQLite, no codegen needed)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # UI / charts
  fl_chart: ^0.69.0

  # Camera / gallery for food capture
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0

  # Google Drive sync
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - Assets/logo.png

# Generate Android launcher icons from Assets/logo.png
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Assets/logo.png"
  adaptive_icon_background: "#0E0F12"
  adaptive_icon_foreground: "Assets/logo.png"
  min_sdk_android: 21
