name: Flutter CI

# Compile otomatis tiap ada push / pull request / trigger manual.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Batalkan run lama pada ref yang sama (hemat menit CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze · Test · Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test || echo "⚠️ Format berbeda (tidak memblokir build)."

      - name: Analyze
        # --no-fatal-infos: info-level lints (mis. deprecation) tidak memblokir build.
        # Warning & error tetap membuat CI gagal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        run: flutter build appbundle --release
        continue-on-error: true   # strip debug symbols butuh NDK; jangan blokir CI

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fitquest-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: fitquest-appbundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
